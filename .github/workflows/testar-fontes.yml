# Testa, a partir do GitHub, se cada fonte de dados responde.
# Rodar uma vez pela aba Actions -> "Testar fontes" -> "Run workflow".
name: Testar fontes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uma requisicao por fonte
        run: python testar_fontes.py
