# Publica a pasta site/ exatamente como esta no repositorio, sem coletar nada
# (cerca de 1 minuto). Roda quando chega mudanca em site/ ou neste arquivo, e
# pelo botao em Actions -> "Publicar agora" -> "Run workflow".
#
# Uso: depois de rodar atualizar.py no computador local e enviar o resultado.
# A atualizacao diaria continua no "Atualizar e publicar", que coleta direto
# das fontes na internet.
name: Publicar agora

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
